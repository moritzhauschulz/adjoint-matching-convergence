# @package _global_

seed: 42
device: cpu

target:
  d: 1          # state dimension
  w1: 0.5        # mixture weight for mode 1 (w2 = 1 - w1)
  lambda1: 1.0  # precision of mode 1
  mu1: -3.0     # centre of mode 1
  lambda2: 1.0  # precision of mode 2
  mu2: 3.0      # centre of mode 2

sigma_schedule: constant   # "constant": σ(t)=sigma ;  "linear": σ(t)=sigma·(floor + (1−floor)(1−t))
sigma: 2.0                  # σ scale at t=0
sigma_floor: 0.0            # linear only: σ(1)/σ(0). 0 ⇒ σ(1)=0; 1 ⇒ constant. ν₁ = sigma²(1+a+a²)/3, need λᵢ > 1/ν₁

sampler:
  steps: 100     # Euler-Maruyama steps N

algorithm:
  objective: ram         # "ram" (reciprocal AM, base-bridge) or "am" (reference L_AM along controlled trajectories; no λ(t) weight)
  n_outer: 256
  n_inner: 256
  n_inner_steps: 500
  buffer_size: 4096
  inner_tol: 0.01        # plateau window range threshold (0 to disable)
  inner_patience: 20     # plateau window size for convergence check

network:
  hidden_dim: 128
  n_layers: 3
  t_emb_dim: 32

training:
  outer_iterations: 50
  lr: 3e-4
  lr_min: 0.0
  inner_warmup_frac: 0.1

eval:
  every: 10
  first_k: 10
  n_time_slices: 100
  n_metric_samples: 512
  linf_x_range: 5.0
  n_linf_grid: 500
  n_sample_paths: 1000
  inner_curve_every: 10
  # Operator T evaluation — also hosts the §"Sanity Check" metrics
  # (‖P(u_θ) − u*‖ with analytic u*, its tiled/ratio forms, and a both-rollout compare)
  op_eval: true             # enable/disable operator T computation
  n_op_mc_samples: 64       # MC draws for estimating P(u)(t,x)
  n_op_grid: 60             # x-grid points for the operator / sanity-check grid
  op_every: 1               # compute every N outer iterations
  sanity_ratio_only: false  # minimal output: only same_bm/sbm_ratio.png (the 2 §Sanity-Check ratios); skip all else
  tiled_sup_percentile: 100.0  # robust "sup" for every tiled/sup-norm: p-th percentile over x AND over the [t,T] suffix (100 = exact max)
  both_rollout_compare: true      # also MC-estimate the both-rollout shared-BM LHS
  n_both_rollout_samples: 64      # shared-BM draws for that comparison (default: n_op_mc_samples)
  # Path-based u^{n+1} vs T(u_n) metric (§3.1): evaluated along sampled trajectories
  n_path_op_samples: 64    # paths under u^{n+1} for the path-based residual
  # Fixed-point sanity check: ‖P(u*)(t,x) − u*(t,x)‖ ≪ 1  (analytic u* self-consistency)
  fixed_point_check: true
  n_fixed_point_mc: 512    # MC rollouts per (t, x) node
  n_fixed_point_grid: 121  # x-grid resolution for the residual heatmap

logging:
  wandb: true
  project: adjoint-matching
  entity: moritz-hauschulz
  log_every: 1
