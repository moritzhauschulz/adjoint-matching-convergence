# @package _global_

seed: 42
device: cpu

target:
  d: 1          # state dimension
  w1: 0.5        # mixture weight for mode 1 (w2 = 1 - w1)
  lambda1: 1.0  # precision of mode 1
  mu1: -3.0     # centre of mode 1
  lambda2: 1.0  # precision of mode 2
  mu2: 3.0      # centre of mode 2

sigma_schedule: constant   # "constant": σ(t)=sigma ;  "linear": σ(t)=sigma·(floor + (1−floor)(1−t))
sigma: 2.0                  # σ scale at t=0
sigma_floor: 0.0            # linear only: σ(1)/σ(0). 0 ⇒ σ(1)=0; 1 ⇒ constant. ν₁ = sigma²(1+a+a²)/3, need λᵢ > 1/ν₁

sampler:
  steps: 100     # Euler-Maruyama steps N

algorithm:
  objective: ram         # "ram" (reciprocal AM, base-bridge) or "am" (reference L_AM along controlled trajectories; no λ(t) weight)
  n_outer: 256
  n_inner: 256
  n_inner_steps: 500
  buffer_size: 4096
  inner_tol: 0.01        # plateau window range threshold (0 to disable)
  inner_patience: 20     # plateau window size for convergence check

network:
  hidden_dim: 128
  n_layers: 3
  t_emb_dim: 32
  time_embedding: sinusoidal   # "sinusoidal" (t_emb_dim features) or "raw" (feed the scalar t — absolute (x,t) coords)

training:
  outer_iterations: 50
  lr: 3e-4
  lr_min: 0.0
  inner_warmup_frac: 0.1

eval:
  every: 10                # eval cadence after the first `first_k` iterations
  first_k: 10              # eval every iteration for the first k
  n_time_slices: 100       # K: time grid t_k = k/K for every field / metric
  n_metric_samples: 512    # u*-sampled states for the RelL2 log line
  n_sample_paths: 1000     # trajectories for terminal_distributions + heatmap overlays (0 = off)
  eval_x_range: 5.0        # x-grid half-width (centred at (mu1+mu2)/2) for every grid below
  n_ctrl_grid: 500         # x resolution of the u* / u_theta control heatmap
  op_eval: true            # compute the self-consistency operator P(u) + the §"Sanity Check" metrics
  n_op_mc_samples: 64      # MC draws per (t,x) for P(u)(t,x)
  n_op_grid: 60            # x resolution of the operator / sanity-check grid
  op_every: 1              # compute P(u) every N outer iterations
  n_path_op_samples: 64    # paths under u^{n+1} for the path-based residuals (§5.2/§5.3)
  sanity_ratio_only: false # skip everything except same_bm/{sbm_ratio,sbm_ratio_learned,u_star_fixed_point_residual}.png
  tiled_sup_percentile: 100.0  # robust "sup": p-th percentile over x AND the [t,T] suffix (100 = exact max)
  fixed_point_check: true  # ‖P(u*)(t,x) − u*(t,x)‖ ≪ 1  (analytic u* self-consistency)
  n_fixed_point_mc: 512    # MC rollouts per (t,x) node
  n_fixed_point_grid: 121  # x resolution of the residual heatmap

logging:
  wandb: true
  project: adjoint-matching
  entity: moritz-hauschulz
  log_every: 1
