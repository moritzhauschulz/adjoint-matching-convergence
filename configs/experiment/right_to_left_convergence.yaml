# @package _global_

seed: 42
device: cpu

target:
  d: 1          # state dimension (1D for clarity in convergence plots)
  lambda_: 2.0   # quadratic reward coefficient r(x) = λ/2‖x‖²; must satisfy λ > 1/σ² = 1/ν₁
  mu: 2.5        # reward centre: target is N(μ, 1/λ)

sigma: 1.0       # constant noise schedule σ(t) = sigma; ν₁ = σ² = 1.0

sampler:
  steps: 100     # Euler-Maruyama steps N

algorithm:
  n_outer: 256
  n_inner: 256
  n_inner_steps: 100
  buffer_size: 100

network:
  hidden_dim: 128
  n_layers: 3
  t_emb_dim: 32

training:
  outer_iterations: 50
  lr: 1e-4

eval:
  every: 1               # evaluate every N outer iterations
  n_time_slices: 100      # evaluate at t_k = k/K, k = 0…K
  n_metric_samples: 512  # samples per time slice for RelL₂ and AbsL₂
  linf_x_range: 5.0      # sup-norm grid covers x ∈ [−x_range, x_range]
  n_linf_grid: 500       # number of uniform grid points for AbsL∞ estimate
  n_sample_paths: 1000    # sample trajectories overlaid on u* / u_theta heatmaps (0 to disable)

logging:
  wandb: true
  project: adjoint-matching
  entity: moritz-hauschulz
  log_every: 1
